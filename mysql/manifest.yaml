apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: expense
spec:
  clusterIP: None
  selector:
    app: expense
    environment: dev
    tier: mysql
    ports:
    - protocol: TCP
      port: 3306  #service port
      targetPort: 3306 #target port of the pod/container

---
apiVersion: v1
kind: Service   
metadata:
  name: mysql
  namespace: expense  
spec:
  selector: 
    app: expense
    environment: dev
    tier: mysql 
    
  ports:
    - protocol: TCP 
      port: 3306  #service port
      targetPort: 3306 #target port of the pod/container

